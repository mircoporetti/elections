apiVersion: apps/v1
kind: Deployment
metadata:
  name: elections
  labels:
    app: elections
spec:
  replicas: 2
  selector:
    matchLabels:
      app: elections
  template:
    metadata:
      labels:
        app: elections
    spec:
      containers:
        - name: elections-container
          image: $CI_REGISTRY/gitlab-mirco/elections:$CI_COMMIT_SHA
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: basic-auth-credentials
                  key: username
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: basic-auth-credentials
                  key: password
      imagePullSecrets:
        - name: gitlab-registry-secret
