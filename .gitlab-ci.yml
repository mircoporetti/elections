stages:
  - build
  - deploy

build:
  stage: build
  image: docker:20.10.7
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker buildx create --use --name electionsbuilder || docker buildx use electionsbuilder
  script:
    - echo "Building the Docker image"
    - docker buildx build --platform linux/amd64 -t $CI_REGISTRY/gitlab-mirco/elections:$CI_COMMIT_SHA . --push
  tags:
    - raspberrypi
  only:
    - branches

deploy:
  stage: deploy
  image: docker:20.10.7
  services:
    - docker:dind
  before_script:
    - echo "$KUBECONFIG" > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - sed -i "s|\$CI_REGISTRY|$CI_REGISTRY|g" k8s/deployment.yml
    - sed -i "s|\$CI_COMMIT_SHA|$CI_COMMIT_SHA|g" k8s/deployment.yml
    - kubectl get ns
    - kubectl -n elections apply -f k8s/deployment.yml
    - kubectl -n elections apply -f k8s/service.yml
  tags:
    - raspberrypi
  only:
    - main
